<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
</head>
<body>
  <p>Hello,</p>
  <p>You requested a password reset for your account. Click the link below to set a new password:</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Reset Password</a></p>
  <p>If you didn't request this, you can ignore this email.</p>
  <p>Thanks,<br/>The Inkwell Team</p>
</body>
</html>
